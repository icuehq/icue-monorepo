name: icue_sdk
description: "Flutter SDK for iCue live school bus tracking with UI and providers."
version: 0.2.0-beta.3
homepage: https://icue.school
publish_to: https://dart.cloudsmith.io/icue/icue-sdk/

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  bus_tracking_core:
    hosted: https://dart.cloudsmith.io/icue/icue-sdk/
    version: ^1.0.0
  device_info_plus: ">=10.0.0 <14.0.0"
  dio: ">=5.0.0 <6.0.0"
  firebase_core: ">=2.20.0 <6.0.0"
  firebase_messaging: ">=14.7.0 <18.0.0"
  flutter:
    sdk: flutter
  get_it: ">=7.6.0 <10.0.0"
  google_maps_flutter: ">=2.5.0 <3.0.0"
  injectable: ">=2.4.0 <3.0.0"
  package_info_plus: ">=8.0.0 <11.0.0"
  provider: ">=6.0.0 <7.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"

dev_dependencies:
  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.12.1

topics:
  - sdk
  - maps
  - tracking
repository: https://github.com/icue-school/icue_sdk
issue_tracker: https://github.com/icue-school/icue_sdk/issues

flutter:
  assets:
    - assets/
