# Library contracts shared by Flutter and Cloud Functions. See contracts/inventory.yaml for the format.

collections:
  - libraryAcquisitions
  - libraryCatalogue
  - libraryCopies
  - libraryFines
  - libraryLoans
  - libraryMembers
  - libraryReservations

enums:
  LoanStatus:
    doc: Lifecycle of a loan.
    values: [active, returned, lost]
  MemberType:
    doc: Who a library member is in the ERP.
    values: [student, teacher]

documents:
  LibraryLoan:
    doc: One issue of a copy to a member.
    collection: libraryLoans
    fields:
      number: string
      memberId: string
      memberType: MemberType
      personErpId: int
      memberName: string?
      barcode: string
      catalogueId: string
      libraryId: string
      campusId: int
      issuedDate: timestamp
      dueDate: timestamp
      remarks: string?
      renewals: list<LoanRenewal>
      policySnapshot: LoanPolicySnapshot
      status: LoanStatus
      issuedBy: string
      issuedAt: timestamp
      returnNumber: string?
      returnedDate: timestamp?
      condition: string?
      overdueDays: int?
      returnRemarks: string?
      receivedBy: string?
      returnedAt: timestamp?
      updatedAt: timestamp?
  LoanRenewal:
    doc: Embedded in a loan on each renewal.
    fields:
      renewedDate: timestamp
      previousDueDate: timestamp
      newDueDate: timestamp
      performedBy: string
  LoanPolicySnapshot:
    doc: Policy values frozen on the loan at issue so later policy edits never move its due date.
    fields:
      policyId: string
      name: string
      maxBooks: int
      loanDays: int
      maxRenewals: int
      fineType: string
      fineAmount: double
      graceDays: int
      maxFine: double?

# Dart view models, generated to <modelsDir>/<file>.g.dart. Field: type, or {type, key, default, notEquals, present, doc, from};
# key is the Firestore key (dotted for nested), from is a raw Dart expression over data/id.
modelsPackage: school_library
modelsDir: features/library/lib/src/models
models:
  library_copies:
    LibraryCopy:
      doc: "One physical book. The document ID is its barcode."
      id: id
      fields:
        catalogueId: string
        libraryId: string
        campusId: int
        shelf: string?
        barcode: { type: string, default: "$id" }
        rfidTag: string?
        condition: { type: string, default: good }
        status: { type: string, default: available }
        price: double
        acquiredDate: day?
        remarks: string?
        heldReservationId: string?
    LibraryAcquisition:
      id: id
      fields:
        number: string
        catalogueId: string
        libraryId: string
        quantity: int
        price: double
        date: day?
        reference: string?
  library_fines:
    LibraryFineWaiver:
      fields:
        amount: double
        reason: string
        performedBy: string
        performedAt: timestamp?
    LibraryFinePayment:
      fields:
        amount: double
        reference: string?
        date: day?
        performedBy: string?
    LibraryFine:
      doc: "A library fine (overdue, lost book replacement, damaged penalty)."
      id: id
      fields:
        fineNumber: { type: string, default: "$id" }
        memberId: string
        memberType: { type: string, default: student }
        personErpId: int
        memberName: string?
        libraryId: string
        campusId: int
        type: { type: string, default: overdue }
        amount: double
        waived: double
        paid: double
        outstanding: double
        status: { type: string, default: outstanding }
        loanId: string?
        incidentId: string?
        barcode: string?
        catalogueId: string?
        fineCalculation: json?
        waivers: list<LibraryFineWaiver>
        payments: list<LibraryFinePayment>
        createdAt: timestamp?
  library_incidents:
    LibraryIncident:
      doc: "A lost or damaged book incident (FRS 11.14)."
      id: id
      fields:
        incidentNumber: { type: string, default: "$id" }
        type: { type: string, default: damaged }
        barcode: string
        catalogueId: string
        libraryId: string
        campusId: int
        status: { type: string, default: open }
        reportedDate: day
        memberId: string?
        memberType: string?
        personErpId: int?
        memberName: string?
        loanId: string?
        severity: string?
        description: string?
        charge: double
        repairCost: double?
        repairStatus: string?
        resolution: string?
        resolutionRemarks: string?
        resolvedAt: timestamp?
        createdAt: timestamp?
  library_loans:
    LibraryLoan:
      document: LibraryLoan
      doc: "One issue of a copy to a member (FRS 11.9\u201311.11). Policy values are frozen on the loan at issue."
      id: id
      fields:
        number: string
        memberId: string
        memberType: { type: string, default: student }
        personErpId: int
        memberName: string?
        barcode: string
        catalogueId: string
        libraryId: string
        issuedDate: day
        dueDate: day
        renewals: { type: int, length: true }
        maxRenewals: { type: int, key: policySnapshot.maxRenewals }
        status: { type: string, default: active }
        returnedDate: day?
        condition: string?
        overdueDays: int?
  library_masters:
    SchoolLibrary:
      id: id
      fields:
        name: string
        campusId: int
        location: string?
        hours: string?
        active: { type: bool, key: status, notEquals: inactive }
    LibraryCategory:
      id: id
      fields:
        name: string
        description: string?
        parentId: string?
        active: { type: bool, key: status, notEquals: inactive }
    LibraryBook:
      doc: "A catalogue title (FRS 11.4). classIds are ERP class ids the book is meant for (no sections); empty means a general book for any class. Search rows carry only the list fields, so the detail-only ones (description, pages, class number, keywords) are empty there."
      id: id
      fields:
        title: string
        subtitle: string?
        authors: list<string>
        publisher: string?
        edition: string?
        year: int?
        language: string?
        categoryId: string
        classIds: list<int>
        description: string?
        pages: int?
        shelf: string?
        keywords: list<string>
        active: { type: bool, key: status, notEquals: inactive }
  library_members:
    LibraryPolicy:
      doc: "Borrowing rules of one person type (student or teacher) in one library, for the listed book categories or, when none are listed, every other category (FRS 11.8)."
      id: id
      fields:
        name: string
        libraryId: string
        memberType: { type: string, default: student }
        maxBooks: int
        loanDays: int
        maxRenewals: int
        fineType: { type: string, default: none }
        fineAmount: double
        graceDays: int
        maxFine: double?
        categoryIds: list<string>
        active: { type: bool, key: status, notEquals: inactive }
    LibraryMember:
      doc: "A student or teacher who has borrowed or reserved (FRS 11.7). Created on first use from the ERP details; the ERP stays the source of truth."
      id: id
      fields:
        memberType: { type: string, default: student }
        personErpId: int
        name: string
        classId: int?
        activeLoans: int
        blocked: bool
  library_reservations:
    LibraryReservation:
      doc: "A book reservation placed by a member (FRS 11.12)."
      id: id
      fields:
        number: string
        memberId: string
        memberType: { type: string, default: student }
        personErpId: int
        memberName: string?
        catalogueId: string
        title: string
        libraryId: string
        campusId: int
        status: { type: string, default: waiting }
        heldBarcode: string?
        holdUntil: day?
        fulfilledLoanId: string?
        fulfilledBarcode: string?
        createdAt: timestamp?
