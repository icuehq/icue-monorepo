# Guide 1.3.17 (revise the PO with a reason, then re-acknowledge). Needs purchase-order-issue.yaml first.
# Skipped once revised ("Rev 1" shows on the list card only). The app has no supplier-reference prompt,
# so ACK-APEX-9921-R1 is not entered.
appId: com.thoughtniques.icueadmin.dev
---
- runFlow:
    file: ../helpers/open-inventory-page.yaml
    env:
      PAGE: Purchase orders
- runFlow:
    when:
      notVisible: ".*Rev 1.*"
    commands:
      - tapOn: ".*PO/20.*"
      - tapOn: "Revise PO"
      - tapOn: "Ballpoint Pen.*unit price.*"
      - eraseText: 10
      - inputText: "14"
      - pressKey: Enter
      - tapOn: "Revision reason.*"
      - inputText: "Negotiated educational volume discount on pens"
      - tapOn: "Save Revision"
- runFlow:
    file: ../helpers/open-inventory-page.yaml
    env:
      PAGE: Purchase orders
- tapOn: ".*PO/20.*"
- runFlow:
    when:
      visible: "Confirm Vendor Acknowledged"
    commands:
      - tapOn: "Confirm Vendor Acknowledged"
- runFlow:
    file: ../helpers/open-inventory-page.yaml
    env:
      PAGE: Purchase orders
- assertVisible: ".*PO/20.*Rev 1.*Acknowledged.*Total: ₹1,29,101.00.*"
