# Guide 1.3.11-1.3.12 (record two quotations on the approved PR). Needs purchase-request-approve.yaml and
# vendors.yaml first. Each runs only if its vendor has no quotation yet.
appId: com.thoughtniques.icueadmin.dev
---
- runFlow:
    file: ../helpers/open-inventory-page.yaml
    env:
      PAGE: Purchase requests
- tapOn: "PR/.*"
- tapOn: "Quotations"
- runFlow:
    when:
      notVisible: ".*QT-APEX-2026-09.*"
    commands:
      - runFlow:
          file: ../helpers/add-quotation.yaml
          env:
            VENDOR: "Apex Educational.*"
            REF: QT-APEX-2026-09
            VALID_DAYS: "30"
            LEAD_DAYS: "5"
            PEN_PRICE: "14.50"
            LAPTOP_PRICE: "54000"
- runFlow:
    when:
      notVisible: ".*QT-GLB-881.*"
    commands:
      - runFlow:
          file: ../helpers/add-quotation.yaml
          env:
            VENDOR: "Global Tech.*"
            REF: QT-GLB-881
            VALID_DAYS: "15"
            LEAD_DAYS: "12"
            PEN_PRICE: "15.50"
            LAPTOP_PRICE: "53500"
# 1.3.13 comparison: totals and lead times per vendor, Global flagged as the lowest quote
- assertVisible: "Apex Educational Supplies Ltd..*QT/.*QT-APEX-2026-09.*Total: ₹1,09,450.00.*Delivery lead time.*5 days.*"
- assertVisible: "Global Tech & Lab Instruments.*QT/.*QT-GLB-881.*Lowest Quote.*Total: ₹1,08,550.00.*Delivery lead time.*12 days.*"
- assertVisible: "Price Comparison Table"
