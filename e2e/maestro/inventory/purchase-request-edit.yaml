# Guide 1.3.5 (edit draft PR: pen quantity 120 -> 100, total 2,76,500). Needs purchase-request.yaml first.
# Skipped once edited (the 120-unit line is gone).
appId: com.thoughtniques.icueadmin.dev
---
- runFlow:
    file: ../helpers/open-inventory-page.yaml
    env:
      PAGE: Purchase requests
- tapOn: "PR/.*"
- runFlow:
    when:
      visible: "Items \\(2\\).*120 × ₹15.00.*"
    commands:
      - tapOn: "Edit"
      - tapOn: "Quantity.*"
      - eraseText: 5
      - inputText: "100"
      - pressKey: Enter
      - tapOn: "Save as Draft"
      - tapOn: "PR/.*"
- assertVisible: "Items \\(2\\).*100 × ₹15.00.*₹1,500.00.*5 × ₹55,000.00.*₹2,76,500.00.*"
