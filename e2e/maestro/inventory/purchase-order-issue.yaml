# Guide 1.3.15 (issue and acknowledge the PO). Needs purchase-order.yaml first. Each step runs only while its
# button exists. App differs from the guide: both actions are single taps (no supplier reference prompt), and
# the PO is a list card labelled "<n>, PO/..." so it is matched as ".*PO/20.*".
appId: com.thoughtniques.icueadmin.dev
---
- runFlow:
    file: ../helpers/open-inventory-page.yaml
    env:
      PAGE: Purchase orders
- tapOn: ".*PO/20.*"
- runFlow:
    when:
      visible: "Issue PO"
    commands:
      - tapOn: "Issue PO"
      - tapOn: ".*PO/20.*"
- runFlow:
    when:
      visible: "Confirm Vendor Acknowledged"
    commands:
      - tapOn: "Confirm Vendor Acknowledged"
- runFlow:
    file: ../helpers/open-inventory-page.yaml
    env:
      PAGE: Purchase orders
- assertVisible: ".*PO/20.*Acknowledged.*Total: ₹1,29,151.00.*"
- assertVisible: "Acknowledged \\(1\\)"
