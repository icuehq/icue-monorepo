name: icue_firebase
description: "Centralized Firebase setup (core, analytics, messaging) shared by all icue apps."
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  # Pinned to the releases using Firebase iOS SDK 12.19.0, the newest on CocoaPods trunk.
  # Unpin once trunk has 12.19.3 (firebase_core 5.1.0).
  firebase_analytics: 13.0.0
  firebase_core: 5.0.0
  firebase_crashlytics: 6.0.0
  firebase_messaging: 17.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
