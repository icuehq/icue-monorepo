    sdk: flutter
  google_maps_flutter: ">=2.5.0 <3.0.0"
  intl: ">=0.18.0 <1.0.0"
  url_launcher: ">=6.1.0 <7.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
