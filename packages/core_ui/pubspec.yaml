name: core_ui
description: "Shared design tokens, Montserrat typography, and reusable widgets for icue apps."
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  in_app_update_flutter: ^3.0.0
  intl: ^0.20.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
        - asset: fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
