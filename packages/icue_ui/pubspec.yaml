name: icue_ui
description: "The single shared UI package for all iCue apps: theme, Montserrat typography, widgets, tables, layouts, formatting helpers and UI services."
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  connectivity_plus: ^7.3.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  go_router: ^18.1.1
  icue_firebase:
  image_picker: ^1.2.3
  in_app_update_flutter: ^3.0.0
  intl: ^0.20.2
  mobile_scanner: ^7.4.3
  package_info_plus: ^10.2.2
  provider: ^6.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
        - asset: fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
